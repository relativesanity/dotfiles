set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

set -sg escape-time 10
set -g base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g detach-on-destroy off

setw -g pane-base-index 1
setw -g mode-keys vi
setw -g aggressive-resize on

set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:extkeys"
set -as terminal-features ",*:clipboard"

set -g focus-events on
set -g mouse on
set -g set-clipboard on

set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

set -g cursor-style bar
set -g cursor-colour "#7f849c"  # overlay1, matches Ghostty so OSC-112 reset can't drop it

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "tmux list-keys | less -R"

# Window/session management
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window
bind -N "Kill pane" x kill-pane

bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

# Pane splits, prefixed
bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"

# Pane focus, no prefix
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# Pane resize, prefixed (Ctrl+Alt+Shift is already claimed globally by
# AeroSpace's own focus-movement, so this stays behind the prefix instead of
# living on that same no-prefix chord)
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Window switching, no prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

bind Space display-popup -d "#{pane_current_path}" -w 80% -h 80%

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Use terminal ANSI colors so tmux adapts to Ghostty's theme automatically
# colour0-7: normal ANSI colors (black, red, green, yellow, blue, magenta, cyan, white)
# colour8-15: bright ANSI colors
# colour15 = bright white (text), colour10 = bright green, colour8 = bright black (overlays)
# colour7 = white (subtext), colour0 = black (base/background)

set -g status-position top
set -g status-left-length 100
set -g status-style "fg=colour7,bg=default"
set -g status-left "#[fg=colour15,bold] #S "
set -g status-right "#[fg=colour15,bold] #(whoami)#[fg=default,nobold]@#[fg=colour15,bold]#H "
set -g window-status-current-format " |  #[fg=colour15,bold]#I#[fg=default,nobold]:#[fg=colour15,bold]#W"
set -g window-status-format " |  #I:#W"

set -g message-style "fg=default,bg=default"
set -g mode-style "fg=default,bg=colour0"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour8"
set -g pane-border-status top
set -g pane-border-format ""
