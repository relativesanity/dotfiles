# AeroSpace Tiling Window Manager Configuration
# https://nikitabobko.github.io/AeroSpace/
#
# Custom Keybindings:
#   meh (ctrl-alt-shift):
#     Focus:     h/j/k/l - vim-style directional focus
#     Move:      y/u/i/o - vim-style directional move
#     Layout:    [ - toggle accordion/tiles
#     Service:   ; - toggle service mode (reload, reset layout, join windows)
#     Omarchy:   a - toggle omarchy mode (Omarchy's Hyprland bindings, on cmd)
#
#   Floating/tiling toggle (meh-/) and resize (meh-m/n, shrink/grow) both live
#   in Hammerspoon's windows.lua — resize shells out to `aerospace resize
#   smart` when tiled, or resizes the frame directly when floating; the
#   toggle also centres the window when it lands on floating — see
#   ~/.hammerspoon
#
#   hyper (ctrl-alt-shift-cmd):
#     Workspace: a/s/d/f/g - switch to workspace 1-5
#     Move+Go:   q/w/e/r/t - move window to workspace 1-5 and follow
#     Fullscreen: p - toggle fullscreen

after-startup-command = [
    'exec-and-forget sketchybar',
    'exec-and-forget $HOME/.config/borders/bordersrc'
]

# Notify Sketchybar about workspace changes
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Notify Sketchybar about window focus changes. No mouse-follows-focus here:
# AeroSpace can't tell a click-driven focus change from a keybind-driven one,
# so window-lazy-center's "skip if already inside" guard warped the cursor on
# plain clicks too often to be worth it.
on-focus-changed = [
    'exec-and-forget sketchybar --trigger window_focus'
]

# Notify Sketchybar about binding-mode changes (main/service/omarchy). This fires on
# every transition but doesn't say which mode it landed in - sketchybar's
# mode_indicator.sh asks `aerospace list-modes --current` itself instead.
on-mode-changed = [
    'exec-and-forget sketchybar --trigger aerospace_mode_change'
]

config-version = 2

# Keeps workspaces 1-5 alive when empty so sketchybar always lists all 5.
# Details: https://github.com/nikitabobko/AeroSpace/issues/999
persistent-workspaces = ["1", "2", "3", "4", "5"]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 28

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = [{ monitor."Studio Display" = 48 }, 16]
    inner.vertical =   [{ monitor."Studio Display" = 48 }, 16]
    outer.left =       [{ monitor."Studio Display" = 48 }, 16]
    outer.bottom =     [{ monitor."Studio Display" = 48 }, 16]
    outer.top =        [{ monitor."Studio Display" = 86 }, 24]
    outer.right =      [{ monitor."Studio Display" = 48 }, 16]

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    # ctrl-alt-shift-slash = 'layout tiles horizontal vertical'
    # ctrl-alt-shift-comma = 'layout accordion horizontal vertical'
    ctrl-alt-shift-leftSquareBracket = 'layout accordion tiles'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    ctrl-alt-shift-h = 'focus left'
    ctrl-alt-shift-j = 'focus down'
    ctrl-alt-shift-k = 'focus up'
    ctrl-alt-shift-l = 'focus right'
    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    ctrl-alt-shift-semicolon = 'mode service'
    ctrl-alt-shift-a = 'mode omarchy'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    ctrl-alt-shift-y = 'move left'
    ctrl-alt-shift-u = 'move down'
    ctrl-alt-shift-i = 'move up'
    ctrl-alt-shift-o = 'move right'
    ctrl-alt-shift-p = 'fullscreen'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    ctrl-alt-shift-cmd-a = 'workspace 1'
    ctrl-alt-shift-cmd-s = 'workspace 2'
    ctrl-alt-shift-cmd-d = 'workspace 3'
    ctrl-alt-shift-cmd-f = 'workspace 4'
    ctrl-alt-shift-cmd-g = 'workspace 5'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    ctrl-alt-shift-cmd-q = ['move-node-to-workspace 1', 'workspace 1']
    ctrl-alt-shift-cmd-w = ['move-node-to-workspace 2', 'workspace 2']
    ctrl-alt-shift-cmd-e = ['move-node-to-workspace 3', 'workspace 3']
    ctrl-alt-shift-cmd-r = ['move-node-to-workspace 4', 'workspace 4']
    ctrl-alt-shift-cmd-t = ['move-node-to-workspace 5', 'workspace 5']

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    # ctrl-alt-shift-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    # ctrl-alt-shift-cmd-tab = 'move-workspace-to-monitor --wrap-around next'


# Window rules
# To find app-id (bundle identifier):
# - Regular apps: mdls -name kMDItemCFBundleIdentifier /Applications/AppName.app
# - Safari SSBs: /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" ~/Applications/AppName.app/Contents/Info.plist
#   (Safari SSBs use format: com.apple.Safari.WebApp.{UUID})

# Tile everything by default (AeroSpace's default behavior). Apps below are
# opted into floating instead.
# Toggle the current window manually with ctrl-alt-shift-cmd-p
[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.iCal'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.anthropic.claudefordesktop'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.MobileSMS'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.manytricks.Moom'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Music'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'org.whispersystems.signal-desktop'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.culturedcode.ThingsMac'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Safari.WebApp.4EF52CD3-780D-4265-8E9B-5EB7650B3196'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Safari.WebApp.3D36C4CC-1ED4-4945-BB26-8A5373748889'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Safari.WebApp.A140371B-6529-45EF-8F73-A9942E094D74'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Safari.WebApp.ABA59A85-ADF9-4799-98A6-078299274FDE'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'us.zoom.xos'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.weather'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.Passwords'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.daisydiskapp.DaisyDisk'
    run = 'layout floating'

# Dwindle tiling. These rules must stay below the floating rules above, which
# match first and stop.
# A new window lands right after the last-used tiled one. Joining the two
# splits that window's space instead of adding a column or row.
# Windows already open when AeroSpace starts keep the flat layout.
[[on-window-detected]]
    if.during-aerospace-startup = true
    run = 'true'

# Horizontal parent, horizontal root. This covers the second window on a
# workspace, where the join wraps both of the root's children and the wrapper
# becomes the new, vertical root. Only that case changes the root's
# orientation, so the test spots it and sets the pair back to side by side.
[[on-window-detected]]
    if = 'test %{window-parent-container-layout} = h_tiles && test %{workspace-root-container-layout} = h_tiles'
    run = 'join-with left && test %{workspace-root-container-layout} = v_tiles && layout horizontal'

[[on-window-detected]]
    if = 'test %{window-parent-container-layout} = h_tiles'
    run = 'join-with left'

# A second window under a vertical root flips the root to horizontal the same
# way. That is the wanted result, so it needs no correction.

[[on-window-detected]]
    if = 'test %{window-parent-container-layout} = v_tiles'
    run = 'join-with up'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = 'mode main'
    ctrl-alt-shift-semicolon = 'mode main' # toggle back off
    ctrl-alt-shift-a = 'mode omarchy' # swap straight to omarchy mode
    r = ['reload-config', 'mode main']
    x = ['flatten-workspace-tree', 'mode main'] # reset layout

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    h = ['join-with left', 'layout accordion', 'mode main']
    j = ['join-with left', 'mode main']
    k = ['join-with right', 'mode main']
    l = ['join-with right', 'layout accordion', 'mode main']

# 'omarchy' binding mode declaration.
# Omarchy's Hyprland window-management bindings, with cmd standing in for
# Super. Defaults come from the manual's hotkeys page
# (https://learn.omacom.io/2/the-omarchy-manual/53/hotkeys), then the
# overrides in the Omarchy dotfiles' hypr/bindings.lua go on top: hjkl replace
# the arrows, which moves split toggle from j to r.
#
# The mode stays on until toggled off, and while it is on these keys never
# reach the app: cmd-w closes the whole window, cmd-h doesn't hide, cmd-1 to 5
# don't pick tabs. None of main's meh/hyper bindings apply here either.
#
# Hyprland features AeroSpace lacks are left unbound: sticky (o), pseudo (p),
# full width, the workspace layout toggle (m), the scratchpad (s), centring a
# float (period) and the 16:10 single-window toggle. Groups map onto accordion
# containers.
[mode.omarchy.binding]
    esc = 'mode main'
    ctrl-alt-shift-a = 'mode main' # toggle back off
    ctrl-alt-shift-semicolon = 'mode service' # swap straight to service mode

    cmd-w = 'close'
    cmd-t = 'layout floating tiling'
    cmd-f = 'fullscreen'
    cmd-r = 'layout horizontal vertical' # toggle window split

    cmd-h = 'focus left'
    cmd-j = 'focus down'
    cmd-k = 'focus up'
    cmd-l = 'focus right'

    cmd-shift-h = 'swap left'
    cmd-shift-j = 'swap down'
    cmd-shift-k = 'swap up'
    cmd-shift-l = 'swap right'

    cmd-equal = 'resize width +100'
    cmd-minus = 'resize width -100'
    cmd-shift-equal = 'resize height +100'
    cmd-shift-minus = 'resize height -100'

    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'

    # Move window to workspace and follow. Omarchy's own Super+Shift+N can't be
    # used: cmd-shift-3/4/5 are the macOS screenshot keys, and both fire. The
    # Omarchy dotfiles bind Super+AltGr+N to match, AltGr being the hold on l.
    cmd-alt-1 = ['move-node-to-workspace 1', 'workspace 1']
    cmd-alt-2 = ['move-node-to-workspace 2', 'workspace 2']
    cmd-alt-3 = ['move-node-to-workspace 3', 'workspace 3']
    cmd-alt-4 = ['move-node-to-workspace 4', 'workspace 4']
    cmd-alt-5 = ['move-node-to-workspace 5', 'workspace 5']

    # Move window to workspace without following
    cmd-alt-shift-1 = 'move-node-to-workspace 1'
    cmd-alt-shift-2 = 'move-node-to-workspace 2'
    cmd-alt-shift-3 = 'move-node-to-workspace 3'
    cmd-alt-shift-4 = 'move-node-to-workspace 4'
    cmd-alt-shift-5 = 'move-node-to-workspace 5'

    cmd-alt-shift-h = 'move-workspace-to-monitor left'
    cmd-alt-shift-j = 'move-workspace-to-monitor down'
    cmd-alt-shift-k = 'move-workspace-to-monitor up'
    cmd-alt-shift-l = 'move-workspace-to-monitor right'

    # Groups, as accordions: toggle one, move a window into the one next door,
    # step through the windows inside
    cmd-g = 'layout accordion tiles'
    cmd-alt-h = ['join-with left', 'layout accordion']
    cmd-alt-j = ['join-with down', 'layout accordion']
    cmd-alt-k = ['join-with up', 'layout accordion']
    cmd-alt-l = ['join-with right', 'layout accordion']
    cmd-ctrl-h = 'focus dfs-prev'
    cmd-ctrl-l = 'focus dfs-next'

    alt-tab = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
    alt-shift-tab = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'
    ctrl-alt-tab = 'focus-monitor --wrap-around next'
    ctrl-alt-shift-tab = 'focus-monitor --wrap-around prev'
